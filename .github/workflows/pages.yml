name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macaly-3d-portfolio/package-lock.json

      - name: Install, test and build the 3D portfolio
        working-directory: macaly-3d-portfolio
        run: |
          npm ci
          npm test
          npm run build:pages
          if [ ! -s .output-pages/index.html ] && [ -s .output-pages/github-pages.html ]; then
            cp .output-pages/github-pages.html .output-pages/index.html
          fi
          test -s .output-pages/index.html
          find .output-pages/assets -type f -name '*.js' | grep -q .

      - name: Assemble existing site and 3D portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages-site/macaly-3d-portfolio
          cp -a .nojekyll index.html about.html contact.html projects.html script.js site.json styles.css projects .pages-site/
          cp -a macaly-3d-portfolio/.output-pages/. .pages-site/macaly-3d-portfolio/
          touch .pages-site/.nojekyll
          test -s .pages-site/index.html
          test -s .pages-site/macaly-3d-portfolio/index.html
          test -s .pages-site/macaly-3d-portfolio/favicon.svg
          test -s .pages-site/macaly-3d-portfolio/manifest.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
