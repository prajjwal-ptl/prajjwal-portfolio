spring.application.name=wanderlust-api
server.port=${PORT:8080}

# Local MySQL defaults; override these environment variables outside local development.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wanderlust_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Convenient for local development; use validate + migrations for production deployments.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Demo credentials only. Set API_USER and API_PASSWORD to non-default values before use.
spring.security.user.name=${API_USER:devuser}
spring.security.user.password=${API_PASSWORD:change-me-before-use}
