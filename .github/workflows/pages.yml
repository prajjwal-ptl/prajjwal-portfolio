name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macaly-3d-portfolio/package-lock.json

      - name: Install, test and build the 3D portfolio
        working-directory: macaly-3d-portfolio
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm run build:pages
          if [ ! -s .output-pages/index.html ] && [ -s .output-pages/github-pages.html ]; then
            cp .output-pages/github-pages.html .output-pages/index.html
          fi
          test -s .output-pages/index.html
          find .output-pages/assets -type f -name '*.js' | grep -q .

      - name: Assemble existing site and 3D portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pages-site/macaly-3d-portfolio
          cp -a .nojekyll index.html about.html contact.html projects.html script.js site.json styles.css projects .pages-site/
          cp -a macaly-3d-portfolio/.output-pages/. .pages-site/macaly-3d-portfolio/
          touch .pages-site/.nojekyll
          test -s .pages-site/index.html
          test -s .pages-site/macaly-3d-portfolio/index.html
          test -s .pages-site/macaly-3d-portfolio/favicon.svg
          test -s .pages-site/macaly-3d-portfolio/manifest.json
          # Keep a stable root-level URL for visitors, while preserving the existing root homepage.
          sed \
            -e 's|href="favicon.svg"|href="/prajjwal-portfolio/macaly-3d-portfolio/favicon.svg"|' \
            -e 's|href="manifest.json"|href="/prajjwal-portfolio/macaly-3d-portfolio/manifest.json"|' \
            macaly-3d-portfolio/.output-pages/index.html > .pages-site/portfolio.html
          test -s .pages-site/portfolio.html
          grep -q '/prajjwal-portfolio/macaly-3d-portfolio/assets/' .pages-site/portfolio.html
          # The repository's direct Pages URL should open the redesigned portfolio.
          cp .pages-site/portfolio.html .pages-site/index.html
          grep -q '<title>Prajjwal Patel' .pages-site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live portfolio renders in Chromium
        working-directory: macaly-3d-portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-browser-check
          cd /tmp/portfolio-browser-check
          npm init -y
          npm install playwright
          npx playwright install chromium
          cd "$GITHUB_WORKSPACE/macaly-3d-portfolio"
          node --input-type=module <<'NODE'
          import { chromium } from '/tmp/portfolio-browser-check/node_modules/playwright/index.mjs'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage()
          const pageErrors = []
          page.on('pageerror', (error) => pageErrors.push(error.message))

          try {
            const response = await page.goto('https://prajjwal-ptl.github.io/prajjwal-portfolio/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            })
            if (!response || response.status() !== 200) {
              throw new Error(`Live homepage returned HTTP ${response?.status() ?? 'no response'}`)
            }

            try {
              await page.getByRole('heading', { name: /junior GenAI roles/i }).waitFor({ timeout: 15000 })
              await page.getByText('CarePilot — Customer Support Retrieval Demo', { exact: true }).waitFor({ timeout: 5000 })
              await page.getByText('GitHub Portfolio Website', { exact: true }).waitFor({ timeout: 5000 })
              if (await page.getByText('LeetCode 75', { exact: true }).count() === 0) throw new Error('LeetCode 75 badge data is missing from the rendered page')
              const portrait = await page.locator('img.hero-portrait').evaluate((img) => ({
                complete: img.complete,
                naturalWidth: img.naturalWidth,
                src: img.currentSrc,
              }))
              if (!portrait.complete || portrait.naturalWidth < 500) {
                throw new Error(`Profile portrait did not load correctly: ${JSON.stringify(portrait)}`)
              }
            } catch (error) {
              const rootText = await page.locator('#root').innerText().catch(() => '<no #root element>')
              throw new Error(
                `Live page did not render expected portfolio content. Title=${await page.title()}; rootText=${rootText.slice(0, 500)}; pageErrors=${pageErrors.join(' | ') || '<none>'}; waitError=${error.message}`,
              )
            }

            const projectLinks = await page.locator('#work .project-card .project-actions a').evaluateAll((links) =>
              links.map((link) => ({ href: link.href, rawHref: link.getAttribute('href') })),
            )
            if (projectLinks.length !== 5 || projectLinks.some((link) => {
              try {
                const url = new URL(link.href)
                return !link.rawHref || !['https:', 'http:'].includes(url.protocol) || !url.hostname
              } catch {
                return true
              }
            })) {
              throw new Error(`Project links are missing or invalid: ${JSON.stringify(projectLinks)}`)
            }
            const emailHref = await page.getByRole('link', { name: /Email me/i }).getAttribute('href')
            if (emailHref !== 'mailto:patelprajjwal7@gmail.com') {
              throw new Error(`Unexpected contact email href: ${emailHref}`)
            }

            await page.setViewportSize({ width: 375, height: 812 })
            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 })
            await page.getByRole('heading', { name: /junior GenAI roles/i }).waitFor({ timeout: 15000 })
            const mobileAudit = await page.evaluate(() => {
              const visible = (element) => element.getClientRects().length > 0
              const paragraphs = Array.from(document.querySelectorAll('.portfolio-shell p')).filter(visible)
              const labels = Array.from(document.querySelectorAll([
                '.portfolio-shell small',
                '.portfolio-shell figcaption',
                '.portfolio-shell .eyebrow',
                '.portfolio-shell .section-kicker',
                '.portfolio-shell .section-side-note',
                '.portfolio-shell .meta-label',
                '.portfolio-shell .project-meta',
                '.portfolio-shell .hero-bottomline',
                '.portfolio-shell .footer',
                '.portfolio-shell .contact-note',
                '.portfolio-shell .workflow-kicker',
                '.portfolio-shell .leetcode-eyebrow',
                '.portfolio-shell .project-tags span',
                '.portfolio-shell .tool-tags span',
                '.portfolio-shell .art-index',
                '.portfolio-shell .tool-number',
                '.portfolio-shell .case-overline',
                '.portfolio-shell .case-category',
              ].join(','))).filter(visible)
              const fontViolations = [
                ...paragraphs.filter((el) => parseFloat(getComputedStyle(el).fontSize) < 14)
                  .map((el) => `paragraph ${getComputedStyle(el).fontSize}: ${el.textContent?.trim().slice(0, 40)}`),
                ...labels.filter((el) => parseFloat(getComputedStyle(el).fontSize) < 12)
                  .map((el) => `label ${getComputedStyle(el).fontSize}: ${el.textContent?.trim().slice(0, 40)}`),
              ]
              const rgb = (color) => {
                const values = color.match(/[\\d.]+/g)?.map(Number)
                return values && values.length >= 3
                  ? { r: values[0], g: values[1], b: values[2], a: values.length > 3 ? values[3] : 1 }
                  : null
              }
              const luminance = (color) => {
                const linear = [color.r, color.g, color.b].map((value) => {
                  const channel = value / 255
                  return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4
                })
                return 0.2126 * linear[0] + 0.7152 * linear[1] + 0.0722 * linear[2]
              }
              const ratio = (fg, bg) => {
                const one = luminance(fg)
                const two = luminance(bg)
                return (Math.max(one, two) + 0.05) / (Math.min(one, two) + 0.05)
              }
              const contrastNodes = Array.from(document.querySelectorAll([
                '.portfolio-shell p',
                '.portfolio-shell small',
                '.portfolio-shell figcaption',
                '.portfolio-shell .project-meta',
                '.portfolio-shell .project-tags span',
                '.portfolio-shell .tool-tags span',
                '.portfolio-shell .section-kicker',
                '.portfolio-shell .meta-label',
                '.portfolio-shell .hero-bottomline',
                '.portfolio-shell .footer',
                '.portfolio-shell .contact-note',
                '.portfolio-shell .workflow-kicker',
              ].join(','))).filter(visible)
              const contrastViolations = []
              for (const element of contrastNodes) {
                let bg = null
                for (let parent = element; parent; parent = parent.parentElement) {
                  const candidate = rgb(getComputedStyle(parent).backgroundColor)
                  if (candidate && candidate.a >= 0.99) { bg = candidate; break }
                }
                const fg = rgb(getComputedStyle(element).color)
                if (fg && bg && ratio(fg, bg) < 4.5) {
                  contrastViolations.push(`contrast ${ratio(fg, bg).toFixed(2)}: ${element.textContent?.trim().slice(0, 40)}`)
                }
              }
              const width = document.documentElement.clientWidth
              const scrollWidth = document.documentElement.scrollWidth
              const cards = Array.from(document.querySelectorAll('.project-card')).map((el) => {
                const rect = el.getBoundingClientRect()
                return { left: rect.left, right: rect.right, width: rect.width }
              })
              return { width, scrollWidth, fontViolations, contrastViolations, cards }
            })
            if (mobileAudit.scrollWidth > mobileAudit.width + 1 ||
                mobileAudit.cards.some((card) => card.left < -1 || card.right > mobileAudit.width + 1) ||
                mobileAudit.fontViolations.length ||
                mobileAudit.contrastViolations.length) {
              throw new Error(`375px mobile accessibility/layout audit failed: ${JSON.stringify(mobileAudit)}`)
            }
            if (pageErrors.length > 0) {
              throw new Error(`Browser runtime errors: ${pageErrors.join(' | ')}`)
            }
            console.log('Chromium verified links, email, portrait, 375px layout, type sizes, and 4.5:1 text contrast.')
          } finally {
            await browser.close()
          }
          NODE

      - name: Verify published portfolio URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://prajjwal-ptl.github.io/prajjwal-portfolio"
          for path in "/" "/portfolio.html" "/macaly-3d-portfolio/" "/macaly-3d-portfolio/prajjwal-portrait.webp"; do
            code="$(curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 -sS -o /tmp/pages-check -w '%{http_code}' "$base$path")"
            echo "$base$path -> HTTP $code"
            test "$code" = "200"
          done
          curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 -fsS "$base/" -o /tmp/portfolio.html
          grep -q '<title>Prajjwal Patel' /tmp/portfolio.html
          js_path="$(grep -oE 'src="[^"]+\.js"' /tmp/portfolio.html | head -1 | sed -E 's/^src="([^"]+)".*/\1/')"
          css_path="$(grep -oE 'href="[^"]+\.css"' /tmp/portfolio.html | head -1 | sed -E 's/^href="([^"]+)".*/\1/')"
          test -n "$js_path"
          test -n "$css_path"
          origin="https://prajjwal-ptl.github.io"
          for path in "$js_path" "$css_path" "/prajjwal-portfolio/macaly-3d-portfolio/prajjwal-portrait.webp"; do
            code="$(curl --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 -sS -D /tmp/pages-headers -o /tmp/pages-asset -w '%{http_code}' "$origin$path")"
            echo "$origin$path -> HTTP $code"
            test "$code" = "200"
            test -s /tmp/pages-asset
            case "$path" in
              *.js) grep -Eqi "^content-type: (application|text)/javascript" /tmp/pages-headers ;;
              *.css) grep -Eqi "^content-type: text/css" /tmp/pages-headers ;;
              *.webp) grep -Eqi "^content-type: image/webp" /tmp/pages-headers ;;
            esac
          done
